<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vincent & Myra - Our Album</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Infant:wght@300;400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --dusty-blue: #6B8CAE;
      --cream: #FAF8F5;
      --dark: #2D3748;
      --gray: #6B7280;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      color: var(--dark);
      overflow: hidden;
      height: 100vh;
      user-select: none;
    }

    /* Hero */
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #EBF0F5 0%, #D4DFE8 50%, #C8D4E0 100%);
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      z-index: 100;
    }

    .hero-content { text-align: center; }

    .hero-monogram {
      width: 150px; height: 150px;
      object-fit: contain;
      margin-bottom: 1.5rem;
      opacity: 0;
    }

    .hero-title {
      font-family: 'Cormorant Infant', serif;
      font-size: 2.5rem;
      font-weight: 300;
      color: var(--dark);
      margin-bottom: 0.5rem;
      opacity: 0;
    }

    .hero-subtitle {
      font-size: 0.9rem;
      color: var(--gray);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0;
    }

    .hero-loading { margin-top: 2rem; opacity: 0; }

    .hero-loading-bar {
      width: 150px; height: 3px;
      background: rgba(107,140,174,0.2);
      border-radius: 2px;
      overflow: hidden;
      margin: 0 auto 0.5rem;
    }

    .hero-loading-fill {
      width: 0%; height: 100%;
      background: var(--dusty-blue);
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    .hero-loading-text {
      font-size: 0.75rem;
      color: var(--gray);
    }

    /* Coverflow Section */
    .coverflow-section {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100vh;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--cream);
    }

    .coverflow-section.visible { display: flex; }

    .coverflow-header {
      text-align: center;
      margin-bottom: 1.5rem;
      z-index: 10;
    }

    .coverflow-header img {
      width: 60px; height: 60px;
      object-fit: contain;
      margin-bottom: 0.5rem;
    }

    .coverflow-header h1 {
      font-family: 'Cormorant Infant', serif;
      font-size: 1.8rem;
      font-weight: 300;
      color: var(--dark);
    }

    .coverflow-header p {
      font-size: 0.7rem;
      color: var(--gray);
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    /* Coverflow Stage */
    .coverflow-stage {
      position: relative;
      width: 100%;
      height: 55vh;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      cursor: grab;
      overflow: hidden;
    }

    .coverflow-stage:active { cursor: grabbing; }

    .coverflow-track {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .coverflow-card {
      position: absolute;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      cursor: pointer;
      will-change: transform, opacity;
    }

    .coverflow-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .coverflow-card.center {
      z-index: 5;
      box-shadow: 0 16px 60px rgba(0,0,0,0.3);
    }

    .coverflow-card.above,
    .coverflow-card.below {
      opacity: 0.7;
    }

    /* Footer */
    .coverflow-footer {
      position: absolute;
      bottom: 2rem;
      left: 0; right: 0;
      text-align: center;
      z-index: 10;
    }

    .coverflow-footer p {
      font-family: 'Great Vibes', cursive;
      font-size: 1.3rem;
      color: var(--dusty-blue);
    }

    .coverflow-footer .footer-date {
      font-family: 'Cormorant Infant', serif;
      font-size: 0.85rem;
      color: var(--gray);
      margin-top: 0.2rem;
      letter-spacing: 0.15em;
    }

    /* Hide mobile-only elements on desktop */
    .flipbook-counter,
    .flipbook-hint,
    .half,
    .flap-down,
    .flap-up,
    .fb-divider {
      display: none;
    }

    /* Flipbook viewport on desktop - no overflow, no background */
    @media (min-width: 769px) {
      .flipbook-viewport {
        overflow: visible;
        background: transparent;
        box-shadow: none;
      }
    }

    /* Mobile Flipbook with Split-Flap Animation */
    @media (max-width: 768px) {
      .coverflow-section {
        flex-direction: column;
        background: linear-gradient(180deg, #e8e4df 0%, #d4cfc9 100%);
        padding-top: 1rem;
      }

      .coverflow-header {
        margin-bottom: 1rem;
        text-align: center;
      }

      .coverflow-header img {
        width: 60px; height: 60px;
        margin-bottom: 0.3rem;
      }

      .coverflow-header h1 {
        font-size: 1.4rem;
        margin-bottom: 0.1rem;
      }

      .coverflow-header p {
        font-size: 0.65rem;
      }

      .coverflow-stage {
        height: auto;
        perspective: 1400px;
        padding: 0;
        margin-bottom: 0.5rem;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: visible;
      }

      .flipbook-wrapper {
        position: relative;
        display: inline-flex;
        align-items: center;
      }

      /* Rotation Frame */
      .flipbook-frame {
        position: relative;
        width: 75vw;
        max-width: 320px;
        aspect-ratio: 4 / 3;
        background: linear-gradient(145deg, #4a4a52 0%, #2d2d35 30%, #1a1a22 100%);
        border-radius: 10px;
        padding: 14px;
        margin-right: 0;
        box-shadow:
          0 20px 60px rgba(0,0,0,0.4),
          0 8px 20px rgba(0,0,0,0.3),
          inset 0 1px 0 rgba(255,255,255,0.08),
          inset 0 -1px 0 rgba(0,0,0,0.3);
      }

      .flipbook-viewport {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 4px;
        background: #111;
        box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
      }

      /* Static halves — always showing the currently-settled state */
      .half {
        position: absolute;
        left: 0; right: 0;
        height: 50%;
        overflow: hidden;
      }

      .half img {
        position: absolute;
        left: 0;
        width: 100%;
        height: 200%;
        object-fit: cover;
      }

      .half.top { top: 0; }
      .half.top img { top: 0; }
      .half.bottom { bottom: 0; }
      .half.bottom img { top: -100%; }

      /* Crease line - removed */
      .fb-divider {
        display: none;
      }

      /* Flap face common */
      .flap-face {
        position: absolute;
        inset: 0;
        overflow: hidden;
        backface-visibility: hidden;
        background: #222;
      }

      .flap-face img {
        position: absolute;
        left: 0;
        width: 100%;
        height: 200%;
        object-fit: cover;
      }

      .flap-face.back {
        transform: rotateX(180deg);
      }

      /* Flap DOWN (next) — folds from top hinge */
      .flap-down {
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 50%;
        transform-style: preserve-3d;
        transform-origin: bottom;
        transition: transform 0.65s cubic-bezier(.45,.05,.35,1);
        z-index: 10;
      }

      .flap-down.flipped { transform: rotateX(-180deg); }
      .flap-down .flap-face.front img { top: 0; }
      .flap-down .flap-face.back img { top: -100%; }

      /* Flap UP (prev) — folds from bottom hinge */
      .flap-up {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 50%;
        transform-style: preserve-3d;
        transform-origin: top;
        transition: transform 0.65s cubic-bezier(.45,.05,.35,1);
        z-index: 11;
      }

      .flap-up.flipped { transform: rotateX(180deg); }
      .flap-up .flap-face.front img { top: -100%; }
      .flap-up .flap-face.back img { top: 0; }

      /* Hide coverflow cards on mobile */
      .flipbook-viewport .coverflow-card {
        display: none !important;
      }

      /* Show mobile-only elements */
      .flipbook-counter,
      .flipbook-hint,
      .half,
      .flap-down,
      .flap-up,
      .fb-divider {
        display: block;
      }

      /* Photo Counter */
      .flipbook-counter {
        text-align: center;
        margin-top: 1rem;
        font-size: 0.8rem;
        color: var(--gray);
        letter-spacing: 0.15em;
      }

      /* Swipe hint */
      .flipbook-hint {
        text-align: center;
        margin-top: 0.5rem;
        font-size: 0.65rem;
        color: rgba(107,114,128,0.6);
        letter-spacing: 0.1em;
      }

      .coverflow-footer {
        bottom: 1rem;
      }

      .coverflow-footer p {
        font-size: 1rem;
      }
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.92);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .lightbox.active { display: flex; }

    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 20px 80px rgba(0,0,0,0.4);
      cursor: default;
    }

    .lightbox-close {
      position: absolute;
      top: 1.5rem; right: 1.5rem;
      width: 44px; height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s;
    }

    .lightbox-close:hover { background: rgba(255,255,255,0.3); }
    .lightbox-close svg { width: 20px; height: 20px; stroke: white; }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 50px; height: 50px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s;
    }

    .lightbox-nav:hover { background: rgba(255,255,255,0.25); }
    .lightbox-nav svg { width: 22px; height: 22px; stroke: white; }
    .lightbox-prev { left: 1.5rem; }
    .lightbox-next { right: 1.5rem; }

    .lightbox-counter {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.85rem;
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.1em;
    }

    /* Music Button */
    .music-btn {
      position: fixed;
      top: 2rem; right: 2rem;
      width: 44px; height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(107,140,174,0.12);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 150;
      opacity: 0;
      transition: background 0.3s;
      backdrop-filter: blur(10px);
    }

    .music-btn:hover { background: rgba(107,140,174,0.25); }
    .music-btn svg { width: 20px; height: 20px; stroke: var(--dusty-blue); }
  </style>
</head>
<body>

  <!-- Hero -->
  <section class="hero" id="hero">
    <div class="hero-content">
      <img src="MV.png" alt="MV" class="hero-monogram">
      <h1 class="hero-title">Our Love Story</h1>
      <p class="hero-subtitle">Prenup Album</p>
      <div class="hero-loading" id="heroLoading">
        <div class="hero-loading-bar">
          <div class="hero-loading-fill" id="heroLoadingFill"></div>
        </div>
        <p class="hero-loading-text" id="heroLoadingText">Loading photos...</p>
      </div>
    </div>
  </section>

  <!-- Coverflow -->
  <section class="coverflow-section" id="coverflowSection">
    <div class="coverflow-header">
      <img src="MV.png" alt="MV">
      <h1>Vincent & Myra</h1>
      <p>Prenup Album</p>
    </div>

    <div class="coverflow-stage" id="coverflowStage">
      <div class="flipbook-wrapper">
        <div class="flipbook-frame" id="flipbookFrame">
          <div class="flipbook-viewport" id="flipbookViewport">
            <!-- Desktop: coverflow cards rendered here -->
            <div class="coverflow-track" id="coverflowTrack"></div>

          <!-- Mobile: split-flap animation -->
          <div class="half top"><img id="topStaticImg" src="" alt=""></div>
          <div class="half bottom"><img id="bottomStaticImg" src="" alt=""></div>

          <div class="flap-down" id="flapDown">
            <div class="flap-face front"><img id="flapDownFrontImg" src="" alt=""></div>
            <div class="flap-face back"><img id="flapDownBackImg" src="" alt=""></div>
          </div>

          <div class="flap-up" id="flapUp">
            <div class="flap-face front"><img id="flapUpFrontImg" src="" alt=""></div>
            <div class="flap-face back"><img id="flapUpBackImg" src="" alt=""></div>
          </div>

          <div class="fb-divider"></div>
          </div>
        </div>

        </div>
      </div>
    </div>

    <div class="flipbook-counter" id="flipbookCounter">1 / 75</div>
    <div class="flipbook-hint" id="flipbookHint">swipe to flip</div>

    <div class="coverflow-footer">
      <p>A Greater Story Together</p>
      <div class="footer-date">October 28, 2026</div>
    </div>
  </section>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <button class="lightbox-nav lightbox-prev" id="lightboxPrev">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
    <img id="lightboxImg" src="" alt="">
    <button class="lightbox-nav lightbox-next" id="lightboxNext">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>
    <div class="lightbox-counter" id="lightboxCounter">1 / 75</div>
  </div>

  <!-- Music -->
  <audio id="bgMusic" loop>
    <source src="cc.mp3" type="audio/mpeg">
  </audio>

  <button class="music-btn" id="musicBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="musicOn">
      <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
    </svg>
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="musicOff" style="display:none">
      <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      <line x1="1" y1="1" x2="23" y2="23"/>
    </svg>
  </button>

  <script>
    const track = document.getElementById('coverflowTrack');
    const stage = document.getElementById('coverflowStage');
    const flipbookFrame = document.getElementById('flipbookFrame');
    const flipbookViewport = document.getElementById('flipbookViewport');
    const flipbookCounter = document.getElementById('flipbookCounter');
    const flipbookHint = document.getElementById('flipbookHint');

    // Mobile flip elements
    const topStaticImg = document.getElementById('topStaticImg');
    const bottomStaticImg = document.getElementById('bottomStaticImg');
    const flapDown = document.getElementById('flapDown');
    const flapDownFrontImg = document.getElementById('flapDownFrontImg');
    const flapDownBackImg = document.getElementById('flapDownBackImg');
    const flapUp = document.getElementById('flapUp');
    const flapUpFrontImg = document.getElementById('flapUpFrontImg');
    const flapUpBackImg = document.getElementById('flapUpBackImg');

    const bgMusic = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');
    const musicOn = document.getElementById('musicOn');
    const musicOff = document.getElementById('musicOff');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxCounter = document.getElementById('lightboxCounter');

    let photos = [];
    let musicPlaying = false;
    let currentIndex = 0;
    let lightboxIndex = 0;
    const FLIP_MS = 650;

    // Sizing
    let isMobile = window.innerWidth <= 768;
    let frontW, frontH, sideW, sideH, gap;

    function updateSizes() {
      isMobile = window.innerWidth <= 768;
      if (isMobile) {
        frontW = '100%';
        frontH = '100%';
        sideW = 0; sideH = 0;
        gap = 0;
      } else {
        frontW = 520; frontH = 320;
        sideW = 260; sideH = 160;
        gap = 60;
      }
    }
    updateSizes();
    window.addEventListener('resize', () => { updateSizes(); updatePositions(); });

    // Music
    musicBtn.addEventListener('click', () => {
      if (musicPlaying) {
        bgMusic.pause();
        musicOn.style.display = 'none';
        musicOff.style.display = 'block';
      } else {
        bgMusic.currentTime = 8;
        bgMusic.play();
        musicOn.style.display = 'block';
        musicOff.style.display = 'none';
      }
      musicPlaying = !musicPlaying;
    });

    function startMusic() {
      bgMusic.currentTime = 8;
      bgMusic.play().then(() => {
        musicPlaying = true;
        musicOn.style.display = 'block';
        musicOff.style.display = 'none';
      }).catch(() => {
        musicPlaying = false;
        musicOn.style.display = 'none';
        musicOff.style.display = 'block';
      });
    }

    function getPhotoUrl(photo) {
      if (typeof photo === 'string') return `Prenup/${photo}`;
      return `https://drive.google.com/thumbnail?id=${photo.id}&sz=s800`;
    }

    function getFullUrl(photo) {
      if (typeof photo === 'string') return `Prenup/${photo}`;
      return `https://drive.google.com/thumbnail?id=${photo.id}&sz=s1600`;
    }

    // Build coverflow cards
    function buildCoverflow() {
      track.innerHTML = '';
      photos.forEach((photo, i) => {
        const card = document.createElement('div');
        card.className = 'coverflow-card' + (isMobile ? ' flipbook-card' : '');
        card.dataset.index = i;

        const img = document.createElement('img');
        img.src = getPhotoUrl(photo);
        img.alt = `Photo ${i + 1}`;
        img.loading = 'lazy';
        img.draggable = false;

        card.appendChild(img);
        track.appendChild(card);

        card.addEventListener('click', () => {
          if (i === currentIndex) openLightbox(i);
        });
      });
      updatePositions();
    }

    // Update card positions
    function updatePositions() {
      const cards = track.querySelectorAll('.coverflow-card');

      // Update counter
      if (flipbookCounter) {
        flipbookCounter.textContent = `${currentIndex + 1} / ${photos.length}`;
      }

      if (isMobile) {
        // Mobile: update split-flap static halves
        const url = getPhotoUrl(photos[currentIndex]);
        topStaticImg.src = url;
        bottomStaticImg.src = url;
        flapDownFrontImg.src = url;
        flapUpFrontImg.src = url;

        // Hide coverflow cards on mobile
        cards.forEach(card => { card.style.display = 'none'; });
      } else {
        // Desktop: horizontal coverflow
        cards.forEach(card => { card.style.display = ''; });

        cards.forEach((card, i) => {
          const offset = i - currentIndex;
          const absOffset = Math.abs(offset);

          card.classList.remove('center', 'left', 'right');

          if (offset === 0) {
            card.classList.add('center');
            gsap.to(card, {
              width: frontW, height: frontH,
              x: 0, y: 0,
              rotateX: 0, rotateY: 0,
              scale: 1,
              opacity: 1,
              zIndex: 5,
              duration: 0.4,
              ease: 'power2.out'
            });
          } else {
            const side = offset < 0 ? 'left' : 'right';
            card.classList.add(side);
            const direction = offset < 0 ? -1 : 1;
            const rotateY = direction * Math.min(absOffset * 15, 40);
            const translateX = direction * (frontW / 2 + gap + (absOffset - 1) * (sideW * 0.35));
            const scale = Math.max(1 - absOffset * 0.18, 0.4);
            const opacity = Math.max(1 - absOffset * 0.25, 0.2);
            const zIndex = 4 - Math.min(absOffset, 4);

            gsap.to(card, {
              width: sideW, height: sideH,
              x: translateX, y: 0,
              rotateX: 0, rotateY: rotateY,
              scale: scale,
              opacity: opacity,
              zIndex: zIndex,
              duration: 0.4,
              ease: 'power2.out'
            });
          }
        });
      }
    }

    // Navigate with split-flap animation on mobile
    let isFlipping = false;

    function goTo(index, skipAnimation) {
      const newIndex = Math.max(0, Math.min(index, photos.length - 1));
      if (newIndex === currentIndex) return;

      if (isMobile && !skipAnimation && !isFlipping) {
        isFlipping = true;
        const direction = newIndex > currentIndex ? 'next' : 'prev';
        const incoming = getPhotoUrl(photos[newIndex]);

        if (direction === 'next') {
          flapDown.style.zIndex = 12;
          flapUp.style.zIndex = 10;

          flapDownFrontImg.src = getPhotoUrl(photos[currentIndex]);
          flapDownBackImg.src = incoming;
          topStaticImg.src = incoming;
          flapDown.classList.add('flipped');

          clearTimeout(flapDown._swapT);
          flapDown._swapT = setTimeout(() => { bottomStaticImg.src = incoming; }, 325);

          const onDone = (e) => {
            if (e.propertyName !== 'transform') return;
            flapDown.removeEventListener('transitionend', onDone);
            flapDown.style.transition = 'none';
            flapDown.classList.remove('flipped');
            flapDownFrontImg.src = incoming;
            void flapDown.offsetWidth;
            flapDown.style.transition = '';
            flapUpFrontImg.src = incoming;
            currentIndex = newIndex;
            isFlipping = false;
            updatePositions();
          };
          flapDown.addEventListener('transitionend', onDone);

        } else {
          flapUp.style.zIndex = 12;
          flapDown.style.zIndex = 10;

          flapUpFrontImg.src = getPhotoUrl(photos[currentIndex]);
          flapUpBackImg.src = incoming;
          bottomStaticImg.src = incoming;
          flapUp.classList.add('flipped');

          clearTimeout(flapUp._swapT);
          flapUp._swapT = setTimeout(() => { topStaticImg.src = incoming; }, 325);

          const onDone = (e) => {
            if (e.propertyName !== 'transform') return;
            flapUp.removeEventListener('transitionend', onDone);
            flapUp.style.transition = 'none';
            flapUp.classList.remove('flipped');
            flapUpFrontImg.src = incoming;
            void flapUp.offsetWidth;
            flapUp.style.transition = '';
            flapDownFrontImg.src = incoming;
            currentIndex = newIndex;
            isFlipping = false;
            updatePositions();
          };
          flapUp.addEventListener('transitionend', onDone);
        }
      } else {
        currentIndex = newIndex;
        updatePositions();
      }
    }

    function goNext() {
      if (currentIndex < photos.length - 1) goTo(currentIndex + 1);
    }

    function goPrev() {
      if (currentIndex > 0) goTo(currentIndex - 1);
    }

    // Auto-advance
    let autoAdvanceInterval;
    const AUTO_ADVANCE_DELAY = 3000;

    function startAutoAdvance() {
      clearInterval(autoAdvanceInterval);
      autoAdvanceInterval = setInterval(() => {
        if (currentIndex < photos.length - 1) {
          goTo(currentIndex + 1);
        } else {
          goTo(0);
        }
      }, AUTO_ADVANCE_DELAY);
    }

    function stopAutoAdvance() {
      clearInterval(autoAdvanceInterval);
    }

    let inactivityTimer;
    function resetInactivityTimer() {
      stopAutoAdvance();
      clearTimeout(inactivityTimer);
      inactivityTimer = setTimeout(startAutoAdvance, 8000);
    }

    // Keyboard
    document.addEventListener('keydown', (e) => {
      if (lightbox.classList.contains('active')) {
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextLightbox();
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevLightbox();
        return;
      }
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { goNext(); resetInactivityTimer(); }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { goPrev(); resetInactivityTimer(); }
    });

    // Drag - mouse (desktop horizontal)
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragStartIndex = 0;
    let dragOffset = 0;

    stage.addEventListener('mousedown', (e) => {
      e.preventDefault();
      isDragging = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      dragStartIndex = currentIndex;
      dragOffset = 0;
      stopAutoAdvance();
      stage.style.cursor = 'grabbing';
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - dragStartX;
      const cardWidth = frontW + gap;
      dragOffset = -dx / cardWidth;
      const rawIndex = dragStartIndex + dragOffset;
      const clampedIndex = Math.max(-0.5, Math.min(rawIndex, photos.length - 0.5));
      applyDragPosition(clampedIndex);
    });

    window.addEventListener('mouseup', () => {
      if (!isDragging) return;
      isDragging = false;
      stage.style.cursor = 'grab';
      const rawIndex = dragStartIndex + dragOffset;
      const snapped = Math.round(rawIndex);
      const clamped = Math.max(0, Math.min(snapped, photos.length - 1));
      currentIndex = clamped;
      updatePositions();
      resetInactivityTimer();
    });

    // Touch - swipe for flipbook on mobile
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    stage.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchStartTime = Date.now();
      stopAutoAdvance();
    }, { passive: true });

    stage.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;
      const dx = touchEndX - touchStartX;
      const dy = touchEndY - touchStartY;
      const elapsed = Date.now() - touchStartTime;

      // Swipe up/down for rotation frame flipbook
      if (isMobile) {
        if (Math.abs(dy) > 30 && Math.abs(dy) > Math.abs(dx) && elapsed < 500) {
          if (dy < 0) {
            goNext(); // Swipe up = next (flip down)
          } else {
            goPrev(); // Swipe down = prev (flip up)
          }
          resetInactivityTimer();
        }
      } else {
        // Horizontal swipe for desktop
        if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy) && elapsed < 500) {
          if (dx < 0) {
            goNext(); // Swipe left = next
          } else {
            goPrev(); // Swipe right = prev
          }
          resetInactivityTimer();
        }
      }
    });

    function applyDragPosition(pos) {
      if (isMobile) return; // No drag preview on flipbook

      const cards = track.querySelectorAll('.coverflow-card');

      cards.forEach((card, i) => {
        const offset = i - pos;
        const absOffset = Math.abs(offset);

        card.classList.remove('center', 'left', 'right');

        let w, h, x, rotateY, scale, opacity, zIndex;

        if (absOffset < 0.5) {
          card.classList.add('center');
          w = frontW; h = frontH;
          x = offset * (frontW * 0.45);
          rotateY = offset * -10;
          scale = 1 - absOffset * 0.3;
          opacity = 1 - absOffset * 0.3;
          zIndex = 5;
        } else {
          const side = offset < 0 ? 'left' : 'right';
          card.classList.add(side);
          const dir = offset < 0 ? -1 : 1;
          w = sideW; h = sideH;
          rotateY = dir * Math.min(absOffset * 15, 40);
          x = dir * (frontW / 2 + gap + (absOffset - 1) * (sideW * 0.35));
          scale = Math.max(1 - absOffset * 0.18, 0.4);
          opacity = Math.max(1 - absOffset * 0.25, 0.2);
          zIndex = 4 - Math.min(Math.floor(absOffset), 4);
        }

        card.style.width = w + 'px';
        card.style.height = h + 'px';
        card.style.transform = 'translateX(' + x + 'px) rotateY(' + rotateY + 'deg) scale(' + scale + ')';
        card.style.opacity = opacity;
        card.style.zIndex = zIndex;
        card.style.transition = 'none';
      });
    }

    // Click center card to open lightbox
    let mouseDownX = 0;
    let mouseDownY = 0;
    stage.addEventListener('mousedown', (e) => { mouseDownX = e.clientX; mouseDownY = e.clientY; });
    stage.addEventListener('touchstart', (e) => { mouseDownX = e.touches[0].clientX; mouseDownY = e.touches[0].clientY; }, { passive: true });
    stage.addEventListener('click', (e) => {
      const dx = Math.abs(e.clientX - mouseDownX);
      const dy = Math.abs(e.clientY - mouseDownY);
      if (dx > 5 || dy > 5) return;
      const card = e.target.closest('.coverflow-card');
      if (card && card.classList.contains('center')) {
        openLightbox(parseInt(card.dataset.index));
      }

    function openLightbox(index) {
      lightboxIndex = index;

    function updateLightbox() {
      lightboxImg.src = getFullUrl(photos[lightboxIndex]);

    function nextLightbox() {
      lightboxIndex = (lightboxIndex + 1) % photos.length;

      lightboxIndex = (lightboxIndex - 1 + photos.length) % photos.length;

      }
    }

    document.getElementById('lightboxPrev').addEventListener('click', (e) => { e.stopPropagation(); prevLightbox(); });
    document.getElementById('lightboxNext').addEventListener('click', (e) => { e.stopPropagation(); nextLightbox(); });
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

    let lightboxTouchStartX = 0;
    let lightboxTouchStartY = 0;

    lightbox.addEventListener('touchstart', (e) => {
      lightboxTouchStartX = e.touches[0].clientX;
      lightboxTouchStartY = e.touches[0].clientY;
    }, { passive: true });

    lightbox.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - lightboxTouchStartX;
      const dy = e.changedTouches[0].clientY - lightboxTouchStartY;

      if (isMobile) {
        // Vertical swipe in lightbox on mobile
        if (Math.abs(dy) > 30 && Math.abs(dy) > Math.abs(dx)) {
          if (dy < 0) nextLightbox();
          else prevLightbox();
        }
      } else {
        // Horizontal swipe on desktop
        if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)) {
          if (dx < 0) nextLightbox();
          else prevLightbox();
        }
      }
    });

    gsap.fromTo('.hero-monogram', { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 1.2, delay: 0.3, ease: 'back.out(1.7)' });
    gsap.fromTo('.hero-title', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 1, delay: 0.6 });
    gsap.fromTo('.hero-subtitle', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 1, delay: 0.9 });

      return new Promise((resolve) => {
        let loaded = 0;
        const total = photos.length;
        const heroLoadingFill = document.getElementById('heroLoadingFill');
        const heroLoadingText = document.getElementById('heroLoadingText');
        if (total === 0) { resolve(); return; }
        photos.forEach((photo) => {
          const img = new Image();
          img.onload = img.onerror = () => {
            loaded++;
            const percent = Math.round((loaded / total) * 100);
            heroLoadingFill.style.width = percent + '%';
            heroLoadingText.textContent = `Loading photos... ${percent}%`;
            if (loaded === total) resolve();
          };
          img.src = getPhotoUrl(photo);
        });
      });
    }
