<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vincent & Myra — Already Answered</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Great+Vibes&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --dusty-blue: #6B8CAE;
      --dusty-blue-light: #8BAAC4;
      --dusty-blue-dark: #5A7A9A;
      --dusty-blue-muted: #A3BDD4;
      --silver: #C0C0C0;
      --silver-light: #D8D8D8;
      --silver-dark: #A8A8A8;
      --gray: #6B7280;
      --gray-light: #9CA3AF;
      --gray-dark: #4B5563;
      --white: #FFFFFF;
      --off-white: #FAFBFC;
      --cream: #F8F9FA;
      --dark: #1F2937;
      --font-script: 'Great Vibes', cursive;
      --font-serif: 'Cormorant Infant', Georgia, serif;
      --font-sans: 'Inter', -apple-system, sans-serif;
    }

    body {
      font-family: var(--font-sans);
      background: linear-gradient(135deg, #E8EDF1 0%, #D6E0E8 50%, #C5D3DE 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background: var(--white);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(90, 122, 154, 0.15), 0 5px 20px rgba(0,0,0,0.05);
      opacity: 0;
      transform: translateY(20px) scale(0.95);
    }

    .monogram {
      width: 70px;
      height: 70px;
      object-fit: contain;
      margin: 0 auto 1rem;
      opacity: 0;
      transform: scale(0.5);
    }

    .names {
      font-family: var(--font-script);
      font-size: 2.2rem;
      color: var(--dusty-blue-dark);
      margin-bottom: 0.25rem;
      opacity: 0;
    }

    .date {
      font-family: var(--font-serif);
      font-size: 0.95rem;
      color: var(--gray);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
      opacity: 0;
    }

    .hashtag {
      font-family: var(--font-sans);
      font-size: 0.8rem;
      color: var(--dusty-blue-muted);
      font-weight: 500;
      margin-bottom: 1rem;
      opacity: 0;
    }

    .divider {
      width: 50px;
      height: 1.5px;
      background: var(--silver);
      margin: 1rem auto;
      transform: scaleX(0);
      opacity: 0;
    }

    .already-title {
      font-family: var(--font-serif);
      font-size: 1.3rem;
      color: var(--dusty-blue-dark);
      margin-bottom: 1rem;
      opacity: 0;
    }

    .already-response {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      color: var(--gray);
      margin-bottom: 0.5rem;
      opacity: 0;
    }

    .already-response strong {
      color: var(--dusty-blue);
    }

    .already-message {
      font-family: var(--font-script);
      font-size: 1.1rem;
      color: var(--dusty-blue);
      margin-bottom: 1.5rem;
      opacity: 0;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 25px;
      font-family: var(--font-sans);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0;
      transform: translateY(10px);
    }

    .btn-change {
      background: var(--dusty-blue);
      color: white;
    }

    .btn-change:hover {
      background: var(--dusty-blue-dark);
      transform: translateY(-2px);
    }

    .btn-album {
      background: transparent;
      color: var(--dusty-blue);
      border: 2px solid var(--dusty-blue);
    }

    .btn-album:hover {
      background: var(--dusty-blue);
      color: white;
    }

    .btn-theme {
      background: var(--silver);
      color: var(--dusty-blue-dark);
    }

    .btn-theme:hover {
      background: var(--dusty-blue-muted);
    }

    .footer-msg {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      color: var(--gray-light);
      margin-top: 1.5rem;
      opacity: 0;
    }

    @media (max-width: 480px) {
      .card { padding: 2rem 1.5rem; }
      .names { font-size: 1.8rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="monogram" id="monogram" src="MV.png" alt="M & V">
    <h1 class="names" id="names">Vincent & Myra</h1>
    <p class="date" id="date">October 28, 2026</p>
    <p class="hashtag" id="hashtag">#NaConVinceNaSiMyra</p>

    <div class="divider" id="divider"></div>

    <p class="already-title" id="alreadyTitle">You have already submitted your answer!</p>
    <p class="already-response" id="alreadyResponse"></p>
    <p class="already-message" id="alreadyMessage"></p>

    <div class="buttons">
      <button class="btn btn-change" id="btnChange">Change my answer</button>
      <button class="btn btn-album" id="btnAlbum">View Album</button>
      <button class="btn btn-theme" id="btnTheme">View Event's theme</button>
    </div>

    <p class="footer-msg" id="footerMsg">Thank you for your response!</p>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const name = urlParams.get('name') || 'Guest';
    const response = urlParams.get('response') || '';
    const message = urlParams.get('message') || '';

    const responseLabel = response === 'Accept' ? 'Accept' : 'Decline';
    document.getElementById('alreadyResponse').innerHTML = `Your response: <strong>${responseLabel}</strong>`;
    if (message) {
      document.getElementById('alreadyMessage').textContent = `"${message}"`;
    }

    document.getElementById('btnChange').addEventListener('click', () => {
      window.location.href = `rsvp.html?name=${encodeURIComponent(name)}`;
    });

    document.getElementById('btnAlbum').addEventListener('click', () => {
      window.location.href = 'album.html';
    });

    document.getElementById('btnTheme').addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    const tl = gsap.timeline({ delay: 0.15 });
    tl.to('#card', { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: 'back.out(1.4)' })
      .to('#monogram', { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(1.7)' }, '-=0.25')
      .to('#names', { opacity: 1, duration: 0.35 }, '-=0.2')
      .to('#date', { opacity: 1, duration: 0.25 }, '-=0.15')
      .to('#hashtag', { opacity: 1, duration: 0.25 }, '-=0.1')
      .to('#divider', { opacity: 1, scaleX: 1, duration: 0.4, ease: 'power2.out' }, '-=0.1')
      .to('#alreadyTitle', { opacity: 1, duration: 0.35 }, '-=0.2')
      .to('#alreadyResponse', { opacity: 1, duration: 0.3 }, '-=0.15')
      .to('#alreadyMessage', { opacity: 1, duration: 0.3 }, '-=0.15')
      .to('.btn', { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out', stagger: 0.1 }, '-=0.1')
      .to('#footerMsg', { opacity: 1, duration: 0.25 }, '-=0.1');
  </script>
</body>
</html>
