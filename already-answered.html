<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myra & Vincent — Already Answered</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Great+Vibes&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --dusty-blue: #7B99AB;
      --dusty-blue-dark: #5E8399;
      --dusty-blue-deep: #4A6E8A;
      --dusty-blue-light: #A8C0CF;
      --cream: #FAF8F5;
      --dark: #2D3748;
      --dark-navy: #3D4F5F;
      --gray: #6B7280;
      --gray-light: #9CA3AF;
      --font-script: 'Great Vibes', cursive;
      --font-serif: 'Cormorant Infant', Georgia, serif;
      --font-sans: 'Inter', -apple-system, sans-serif;
    }

    html, body { height: 100%; overflow: hidden; }
    body { font-family: var(--font-sans); background: var(--cream); color: var(--dark); }

    .page { display: flex; height: 100vh; width: 100vw; }

    /* Photo Side with Slideshow */
    .photo-side {
      flex: 2;
      position: relative;
      overflow: hidden;
    }

    .slideshow {
      position: absolute;
      inset: 0;
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Gradient overlay */
    .photo-side::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.25) 0%,
        transparent 30%,
        transparent 50%,
        rgba(0,0,0,0.4) 100%
      );
      z-index: 1;
      pointer-events: none;
    }

    .photo-top-text {
      position: absolute;
      top: 2.5rem;
      left: 2.5rem;
      z-index: 2;
      opacity: 0;
      animation: fadeIn 0.6s 0.3s ease-out both;
    }
    .photo-top-text span {
      display: block;
      font-family: var(--font-sans);
      font-size: 0.55rem;
      font-weight: 500;
      letter-spacing: 0.25em;
      color: rgba(255,255,255,0.9);
      text-transform: uppercase;
      line-height: 1.6;
    }
    .photo-bottom-text {
      position: absolute;
      bottom: 2.5rem;
      left: 2.5rem;
      z-index: 2;
      opacity: 0;
      animation: fadeIn 0.6s 0.5s ease-out both;
    }
    .photo-bottom-text .see-you {
      font-family: var(--font-script);
      font-size: 2.5rem;
      color: white;
      text-shadow: 0 2px 20px rgba(0,0,0,0.3);
      line-height: 1;
    }
    .photo-bottom-text .date-text {
      font-family: var(--font-sans);
      font-size: 0.55rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.85);
      text-transform: uppercase;
      margin-top: 0.3rem;
    }

    /* Mobile photo monogram */
    .photo-monogram-mobile { display: none; }

    /* Bubbles */
    .bubbles {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .bubble {
      position: absolute;
      bottom: -20px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      animation: floatBubble linear infinite;
    }

    @keyframes floatBubble {
      0% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 0.6; }
      100% { transform: translateY(-110vh) translateX(30px) scale(0.6); opacity: 0; }
    }

    /* Content Side */
    .content-side {
      flex: 1;
      background: linear-gradient(170deg, var(--dusty-blue) 0%, var(--dusty-blue-dark) 50%, var(--dusty-blue-deep) 100%);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 2rem;
      overflow: hidden;
    }

    /* Squircle Container */
    .squircle {
      position: relative;
      background: rgba(255,255,255,0.08);
      border-radius: 40px;
      padding: 2rem 1.5rem;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      max-width: 380px;
      width: 100%;
    }

    .squircle-glow {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.15;
      pointer-events: none;
    }
    .squircle-glow-top {
      top: -80px;
      right: -60px;
      background: white;
    }
    .squircle-glow-bottom {
      bottom: -80px;
      left: -60px;
      background: rgba(255,255,255,0.6);
    }

    .content-inner {
      text-align: center;
      position: relative;
      z-index: 2;
      max-width: 380px;
    }

    .monogram {
      width: 60px;
      height: 60px;
      object-fit: contain;
      margin-bottom: 1rem;
      filter: brightness(0) invert(1);
      opacity: 0;
      animation: scaleIn 0.5s 0.2s ease-out both;
    }

    .names {
      font-family: var(--font-serif);
      font-size: 2.5rem;
      font-weight: 300;
      color: white;
      line-height: 1.1;
      margin-bottom: 0.5rem;
      opacity: 0;
      animation: fadeUp 0.5s 0.3s ease-out both;
    }
    .names .amp {
      font-family: var(--font-script);
      font-size: 2.8rem;
      color: rgba(255,255,255,0.7);
      margin: 0 0.05em;
    }

    .date-info {
      font-family: var(--font-serif);
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.85);
      text-transform: uppercase;
      margin-bottom: 1rem;
      opacity: 0;
      animation: fadeUp 0.5s 0.4s ease-out both;
    }

    .already-title {
      font-family: var(--font-serif);
      font-size: 1.1rem;
      font-weight: 400;
      color: white;
      margin-bottom: 0.8rem;
      opacity: 0;
      animation: fadeUp 0.5s 0.55s ease-out both;
    }

    .already-response {
      font-family: var(--font-sans);
      font-size: 0.8rem;
      color: rgba(255,255,255,0.8);
      margin-bottom: 0.3rem;
      opacity: 0;
      animation: fadeUp 0.5s 0.6s ease-out both;
    }
    .already-response strong {
      color: white;
      font-weight: 600;
    }

    .already-message {
      font-family: var(--font-script);
      font-size: 1.1rem;
      color: rgba(255,255,255,0.9);
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeUp 0.5s 0.65s ease-out both;
    }

    /* Buttons */
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      opacity: 0;
      animation: fadeUp 0.5s 0.7s ease-out both;
    }
    .btn {
      display: inline-block;
      padding: 0.85rem 2.5rem;
      border: none;
      border-radius: 50px;
      font-family: var(--font-sans);
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
      min-width: 220px;
    }
    .btn-change {
      background: white;
      color: var(--dusty-blue-dark);
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .btn-change:hover {
      background: rgba(255,255,255,0.9);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    }
    .btn-album {
      background: rgba(255,255,255,0.1);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
    }
    .btn-album:hover {
      background: rgba(255,255,255,0.2);
    }
    .btn-entourage {
      background: rgba(255,255,255,0.1);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
    }
    .btn-entourage:hover {
      background: rgba(255,255,255,0.2);
    }
    .btn-theme {
      background: transparent;
      color: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .btn-theme:hover {
      background: rgba(255,255,255,0.08);
    }

    .footer-text {
      font-family: var(--font-serif);
      font-size: 0.8rem;
      font-weight: 300;
      color: rgba(255,255,255,0.7);
      line-height: 1.6;
      margin-top: 1.5rem;
      opacity: 0;
      animation: fadeUp 0.5s 0.8s ease-out both;
    }

    .same-journey {
      position: absolute;
      bottom: 1.5rem;
      right: 1.5rem;
      text-align: right;
      opacity: 0;
      animation: fadeIn 0.5s 0.9s ease-out both;
    }
    .same-journey span {
      display: block;
      font-family: var(--font-sans);
      font-size: 0.45rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.4);
      line-height: 1.6;
    }

    /* Keyframes */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.7); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Mobile Responsive */
    @media (max-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      .page {
        flex-direction: column;
        height: 100vh;
        min-height: unset;
      }
      .photo-side {
        flex: none;
        height: 35vh;
        min-height: unset;
      }
      .photo-top-text { top: 1.5rem; left: 1.5rem; }
      .photo-bottom-text {
        bottom: auto;
        top: 50%;
        left: auto;
        right: 1.5rem;
        transform: translateY(-50%);
        text-align: right;
      }
      .photo-bottom-text .see-you { font-size: 2rem; }

      .photo-monogram-mobile {
        display: block;
        position: absolute;
        top: 1.5rem;
        right: 1.5rem;
        width: 48px;
        height: 48px;
        object-fit: contain;
        z-index: 3;
        opacity: 0;
        animation: fadeIn 0.6s 0.4s ease-out both;
      }

      .content-side {
        width: 100%;
        min-width: unset;
        flex: 1;
        padding: 1.5rem 1.5rem 1rem;
        border-radius: 0;
        overflow: hidden;
      }

      .squircle {
        padding: 1.5rem 1.25rem;
        border-radius: 28px;
      }
      .squircle-glow { display: none; }

      .monogram { display: none; }

      .names { font-size: 2rem; margin-bottom: 0.3rem; }
      .names .amp { font-size: 1.8rem; }

      .already-title { font-size: 0.75rem; margin-bottom: 0.5rem; }
      .already-response { font-size: 0.65rem; margin-bottom: 0.5rem; }
      .already-message { font-size: 0.8rem; margin-bottom: 0.75rem; }

      .btn { min-width: 200px; padding: 0.6rem 1.2rem; font-size: 0.5rem; margin-bottom: 0.4rem; }

      .same-journey {
        position: relative;
        bottom: auto;
        right: auto;
        text-align: center;
        margin-top: 0.75rem;
        padding-top: 0.75rem;
        border-top: 1px solid rgba(255,255,255,0.15);
      }
      .same-journey span {
        display: inline;
        font-size: 0.5rem;
        letter-spacing: 0.15em;
      }
    }

    @media (max-width: 480px) {
      .photo-side { height: 30vh; }
      .photo-top-text { top: 1rem; left: 1rem; }
      .photo-top-text span { font-size: 0.5rem; }
      .photo-bottom-text .see-you { font-size: 1.6rem; }
      .photo-monogram-mobile { width: 40px; height: 40px; top: 1rem; right: 1rem; }
      .content-side { padding: 1rem 1rem 0.75rem; }
      .squircle { padding: 1.25rem 1rem; border-radius: 24px; }
      .names { font-size: 1.75rem; }
      .names .amp { font-size: 1.6rem; }
      .already-title { font-size: 0.7rem; }
      .already-response { font-size: 0.6rem; }
      .already-message { font-size: 0.75rem; }
      .btn { min-width: 180px; padding: 0.5rem 1rem; font-size: 0.45rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>

  <div class="page">
    <div class="photo-side">
      <!-- Slideshow -->
      <div class="slideshow" id="slideshow">
        <div class="slide active"><img src="https://drive.google.com/thumbnail?id=1sOigdz87q8hGqYrmFx0CZZHQNsjFjx5r&sz=s800" alt="Myra & Vincent"></div>
        <div class="slide"><img src="https://drive.google.com/thumbnail?id=1JzDeutzfJnE13-oSqjKnTeybVjXH07c-&sz=s800" alt="Myra & Vincent"></div>
        <div class="slide"><img src="https://drive.google.com/thumbnail?id=1f1x7ja6LnPJjy3qxjp8LNKiU16oAKssQ&sz=s800" alt="Myra & Vincent"></div>
        <div class="slide"><img src="https://drive.google.com/thumbnail?id=1TLM9yky5xHOL-E-62F5KH-O6y2oHFpQ4&sz=s800" alt="Myra & Vincent"></div>
        <div class="slide"><img src="https://drive.google.com/thumbnail?id=1N8RLKSNZraMMKWeRl9H1n4FGAYKwkkPs&sz=s800" alt="Myra & Vincent"></div>
        <div class="slide"><img src="https://drive.google.com/thumbnail?id=1u9tK-c0tDPuAn1dkzRr_wiTsWU6gwpgo&sz=s800" alt="Myra & Vincent"></div>
        <div class="slide"><img src="https://drive.google.com/thumbnail?id=1p5AxAPD2g-LZ3j6qsm6BmyI78F17Tktm&sz=s800" alt="Myra & Vincent"></div>
        <div class="slide"><img src="https://drive.google.com/thumbnail?id=1LxSUd3oq9r9VHuoeBrJHJA2w9_gCZXac&sz=s800" alt="Myra & Vincent"></div>
      </div>

      <!-- Bubbles -->
      <div class="bubbles" id="bubbles"></div>

      <img src="MV.png" alt="MV" class="photo-monogram-mobile">
      <div class="photo-top-text">
        <span>A Greater</span>
        <span>Story</span>
        <span>Together</span>
      </div>
      <div class="photo-bottom-text">
        <div class="see-you">See you there?</div>
        <div class="date-text">October 28, 2026</div>
      </div>
    </div>

    <div class="content-side">
      <!-- Squircle Glows -->
      <div class="squircle-glow squircle-glow-top"></div>
      <div class="squircle-glow squircle-glow-bottom"></div>

      <div class="squircle">
        <div class="content-inner">
          <img src="MV.png" alt="MV" class="monogram">

          <h1 class="names">Myra <span class="amp">&</span> Vincent</h1>

          <p class="date-info">October 28, 2026</p>

          <p class="already-title">You have already submitted your answer!</p>
          <p class="already-response" id="alreadyResponse"></p>
          <p class="already-message" id="alreadyMessage"></p>

          <div class="buttons">
            <button class="btn btn-change" id="btnChange">Change my answer</button>
            <button class="btn btn-album" id="btnAlbum">View Album</button>
            <button class="btn btn-entourage" id="btnEntourage">Event's Entourage</button>
            <button class="btn btn-theme" id="btnTheme">View Event's theme</button>
          </div>

          <p class="footer-text">Thank you for your response!</p>
        </div>
      </div>

      <div class="same-journey">
        <span>#HeaVincentToMyra</span>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const name = urlParams.get('name') || 'Guest';
    const response = urlParams.get('response') || '';
    const message = urlParams.get('message') || '';

    const responseLabel = response === 'Accept' ? 'Accept' : 'Decline';
    document.getElementById('alreadyResponse').innerHTML = `Your response: <strong>${responseLabel}</strong>`;
    if (message) {
      document.getElementById('alreadyMessage').textContent = `"${message}"`;
    }

    document.getElementById('btnChange').addEventListener('click', () => {
      window.location.href = `invitation.html?name=${encodeURIComponent(name)}`;
    });
    document.getElementById('btnAlbum').addEventListener('click', () => {
      window.location.href = 'album.html';
    });
    document.getElementById('btnEntourage').addEventListener('click', () => {
      window.location.href = 'entourage.html';
    });
    document.getElementById('btnTheme').addEventListener('click', () => {
      window.location.href = 'theme.html';
    });

    // Slideshow
    const slides = document.querySelectorAll('.slide');
    let currentSlide = 0;
    setInterval(() => {
      slides[currentSlide].classList.remove('active');
      currentSlide = (currentSlide + 1) % slides.length;
      slides[currentSlide].classList.add('active');
    }, 4000);

    // Bubbles
    const bubblesContainer = document.getElementById('bubbles');
    for (let i = 0; i < 12; i++) {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      const size = Math.random() * 20 + 6;
      bubble.style.width = size + 'px';
      bubble.style.height = size + 'px';
      bubble.style.left = Math.random() * 100 + '%';
      bubble.style.animationDuration = (Math.random() * 10 + 8) + 's';
      bubble.style.animationDelay = (Math.random() * 6) + 's';
      bubblesContainer.appendChild(bubble);
    }
  </script>
</body>
</html>
